name: build

# Full package build. Tags named v<version>, e.g. v7.3.3-2, publish the packages as a release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # the maximum for GitHub-hosted runners
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          sudo docker image prune -af > /dev/null
          df -h / /mnt

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use the larger disk
        run: |
          if [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail . | tail -1)" ]; then
              sudo mkdir -p /mnt/work && sudo chown "$(id -u):$(id -g)" /mnt/work
              cp -a . /mnt/work/
              echo "WORK=/mnt/work" >> "$GITHUB_ENV"
          else
              echo "WORK=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi

      - name: Check the tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ${{ env.WORK }}
        run: |
          version=$(dpkg-parsechangelog -S Version)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "tag $GITHUB_REF_NAME does not match the package version $version" >&2
              exit 1
          fi

      - name: Build
        working-directory: ${{ env.WORK }}
        run: |
          start=$(date +%s)
          ci/container.sh sh -c 'nproc && free -g && make deb EDGE_LINTIAN=0'
          echo "Built in $(( ($(date +%s) - start) / 60 )) minutes" >> "$GITHUB_STEP_SUMMARY"
          df -h .

      - name: Collect packages
        working-directory: ${{ env.WORK }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          sudo mv ./*.deb "$GITHUB_WORKSPACE/out/"
          cd "$GITHUB_WORKSPACE/out"
          sha256sum ./*.deb > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ github.ref_name }}-${{ github.sha }}
          path: out/
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk 'NR > 2 && /^ -- / { exit } NR > 2' debian/changelog > notes.md
          gh release create "$GITHUB_REF_NAME" out/* --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file notes.md
          gh workflow run apt.yml --ref "${{ github.event.repository.default_branch }}" \
              -f tag="$GITHUB_REF_NAME"
