name: watch

# Daily look for upstream updates, see ci/watch.py: mechanical updates go into a pull request,
# things that need a human into issues.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only print what would be done
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: sudo apt-get install -y -qq patchutils > /dev/null

      - name: Watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/watch.py ${{ inputs.dry-run && '--dry-run' || '' }}
